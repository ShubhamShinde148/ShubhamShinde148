<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="160" rx="10" fill="url(#bg)"/>

  <!-- animated border -->
  <rect x="2" y="2" width="896" height="156" rx="10" fill="none" stroke="url(#borderGlow)" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal dots -->
  <circle cx="30" cy="30" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="30" r="6" fill="#FFBD2E"/>
  <circle cx="74" cy="30" r="6" fill="#27C93F"/>
  <text x="95" y="35" font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6">shubham@hexnova:~</text>

  <!-- prompt line 1: typed then stays -->
  <text x="30" y="75" font-family="Fira Code, monospace" font-size="20" fill="#39FF14" filter="url(#glow)">
    <tspan>$ whoami</tspan>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;0.15" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- typewriter reveal of the answer using clip-path width animation -->
  <clipPath id="reveal">
    <rect x="0" y="0" height="40" width="0">
      <animate attributeName="width" values="0;0;620;620;620;0" keyTimes="0;0.15;0.55;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <g clip-path="url(#reveal)">
    <text x="30" y="110" font-family="Fira Code, monospace" font-size="24" font-weight="600" fill="#ffffff" filter="url(#glow)">
      shubham shinde — CTF architect, hexnova
    </text>
  </g>

  <!-- blinking cursor that trails the typewriter -->
  <rect x="30" y="90" width="12" height="24" fill="#39FF14">
    <animate attributeName="x" values="30;650;650;30" keyTimes="0;0.55;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom status line -->
  <text x="30" y="140" font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6">
    building ctf.hexnova.space
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;0.75" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
